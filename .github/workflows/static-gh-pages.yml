name: publish documentation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  docs_to_gh-pages:
    runs-on: ubuntu-latest
    name: publish documentation
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install uv
        uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: '3.8'
          activate-environment: true

      - name: Install doc dependencies and build docs
        run: |
          bash scripts/install_uv.sh --no-install --no-weights --cpu
          uv pip install -U pip wheel setuptools
          uv sync --group=doc
          cd docs
          uv run --no-sync make html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4.1.0
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: docs/_build/html
          user_name: CompressAI
          user_email: compressai@interdigital.com
