name: basic install 

on: [push, pull_request]
jobs:
  test-install-uv:
    runs-on: ubuntu-latest
    name: basic install of compressai-vision (torch cpu)
    strategy:
      matrix:
        include:
          - python-version: "3.10"
            torch-version: "2.2.0"
            torchvision-version: "0.17.0"
          - python-version: "3.11"
            torch-version: "2.2.0"
            torchvision-version: "0.17.0"
          - python-version: "3.12"
            torch-version: "2.2.0"
            torchvision-version: "0.17.0"

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libjpeg-dev zlib1g-dev libpng-dev

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: install detectron2 and project with pip for test
        run: |
          bash scripts/install.sh -m "detectron2,yolox,segment_anything,jde" --no-weights --cpu --torch "${{ matrix.torch-version }}" --torchvision "${{ matrix.torchvision-version }}"
