variables:
  UV_INSTALL_DIR: "${CI_PROJECT_DIR}/.local/bin"
  UV_CACHE_DIR: "${CI_PROJECT_DIR}/.uv-cache"
  UV_LINK_MODE: copy

stages:
  - setup
  - static-analysis
  - test
  - doc

.default-before-script: &default-before-script
  - git submodule update --init --recursive
  - export PATH="${UV_INSTALL_DIR}:$PATH"
  - source "${UV_INSTALL_DIR}/env"
  - uv run --no-sync python --version
  - bash scripts/install_uv.sh --no-install --no-weights --cpu

uv-install-py310:
  image: python:3.10-bookworm
  stage: setup
  script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - *default-before-script
  artifacts:
    paths:
      - ".local/"
    expire_in: 1 day
  tags:
    - docker

uv-install-py311:
  image: python:3.11-bookworm
  stage: setup
  script:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - *default-before-script
  artifacts:
    paths:
      - ".local/"
    expire_in: 1 day
  tags:
    - docker
ruff-lint:
  stage: static-analysis
  image: python:3.10-bookworm
  before_script:
    - *default-before-script
    - uv pip install -U pip wheel setuptools
    - uv sync --group=dev --extra=cpu
  script:
    - uv run --no-sync make check-ruff-lint
  tags:
    - docker

pytest-py310:
  stage: test
  image: python:3.10-bookworm
  dependencies:
    - uv-install-py310
  before_script:
    - apt-get update -y
    - apt-get install -y libgl1-mesa-glx build-essential
    - *default-before-script
    - uv pip install -U pip wheel setuptools
    - bash scripts/install_uv.sh --no-weights --cpu -m "detectron2,yolox,jde"
    - uv sync --inexact --extra=dev --extra=cpu
  script:
    - uv run --no-sync pytest
  tags:
    - docker

pytest-py311:
  stage: test
  image: python:3.11-bookworm
  dependencies:
    - uv-install-py311
  before_script:
    - apt-get update -y
    - apt-get install -y libgl1-mesa-glx build-essential
    - *default-before-script
    - uv pip install -U pip wheel setuptools
    - bash scripts/install_uv.sh --no-weights --cpu -m "detectron2,yolox,jde"
    - uv sync --inexact --extra=dev --extra=cpu
  script:
    - uv run --no-sync pytest
  tags:
    - docker

pytest-pip-py310:
  stage: test
  image: python:3.10-bookworm
  before_script:
    - apt-get update -y
    - apt-get install -y libgl1-mesa-glx build-essential
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -U pip wheel setuptools
    - bash scripts/install.sh --no-weights --cpu -m "detectron2,yolox,jde"
    - pip install -e .[dev,cpu]
  script:
    - pytest
  tags:
    - docker

pytest-pip-py311:
  stage: test
  image: python:3.11-bookworm
  before_script:
    - apt-get update -y
    - apt-get install -y libgl1-mesa-glx build-essential
    - python3 -m venv venv
    - source venv/bin/activate
    - pip install -U pip wheel setuptools
    - bash scripts/install.sh --no-weights --cpu -m "detectron2,yolox,jde"
    - pip install -e .[dev,cpu]
  script:
    - pytest
  tags:
    - docker

ruff-format:
  stage: static-analysis
  image: python:3.10-bookworm
  before_script:
    - *default-before-script
    - uv pip install -U pip wheel setuptools
    - uv sync --group=dev --extra=cpu
  script:
    - uv run --no-sync make check-ruff-format
  tags:
    - docker

ruff-organize-imports:
  stage: static-analysis
  image: python:3.10-bookworm
  before_script:
    - *default-before-script
    - uv pip install -U pip wheel setuptools
    - uv sync --group=dev --extra=cpu
  script:
    - uv run --no-sync make check-ruff-organize-imports
  tags:
    - docker

doc:
  stage: doc
  image: python:3.10-bookworm
  before_script:
    - *default-before-script
    - uv pip install -U pip wheel setuptools
    - uv sync --group=doc --extra=cpu
    - cd docs
  script:
    - uv run --no-sync make html
  tags:
    - docker
